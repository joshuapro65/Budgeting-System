<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction | Budgeting System</title>
    <!-- Bootstrap CSS for the style and layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- The Navigation Bar, it gives the user a way to navigate the website -->
    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand fw-bold">Budgeting System</span>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </nav>

    <div class="container mt-5">
        <!-- Centers the Edit Transaction Form on the page -->
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Edit Transaction</h3>

                        <!-- Displays a successful or error message after login -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <!-- Edit Transaction Form, which include the type, amount, date, source, description and label sections -->
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Type</label>
                                <input type="text" class="form-control" value="{{ transaction['Type'] | capitalize }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" name="amount" step="0.01" class="form-control"
                                       value="{{ transaction['Amount'] }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" name="date" class="form-control"
                                       value="{{ transaction['Date'] }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Source <span class="text-muted">(optional)</span></label>
                                <input type="text" name="source" class="form-control"
                                       value="{{ transaction['Source'] or '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description <span class="text-muted">(optional)</span></label>
                                <input type="text" name="description" class="form-control"
                                       value="{{ transaction['Description'] or '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Label <span class="text-muted">(optional)</span></label>
                                <select name="label_id" class="form-select">
                                    <option value="">No Label</option>
                                    {% for label in labels %}
                                        <option value="{{ label['LabelID'] }}"
                                            {% if label['LabelID'] == transaction['LabelID'] %}selected{% endif %}>
                                            {{ label['Name'] }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
